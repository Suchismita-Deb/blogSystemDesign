site_name: System Design Toolkit

nav:
  - Home: index.md
  - System Design:
      - Fundamentals: SystemDesign/Fundamentals.md
      - Pattern: SystemDesign/Pattern.md
      - Key Technologies:
          - Redis: SystemDesign/KeyTechnologies/Redis.md
          - DynamoDb: DynamoDb.md
          - Cassandra: Cassandra.md
      - Core Concepts:
          - Network Fundamentals: SystemDesign/CoreConcepts/Network.md
          - Db Fundamentals: SystemDesign/CoreConcepts/Db.md
          - Caching: SystemDesign/CoreConcepts/Caching.md
          - API Design: SystemDesign/CoreConcepts/API.md
      - Advanced Concept:
          - Vector Db: SystemDesign/AdvancedConcept/Vector.md
          - Time Series Db: SystemDesign/AdvancedConcept/TimeSeriesDb.md

  - High-Level Design (HLD): SystemDesign/HighLevelDesign.md

  - Low-Level Design (LLD):
      - Structural Pattern: 07LLDExample/StructuralPattern.md

  - Java:
      - Code Quiz: 02Java/03CodeSnippet.md

  - Microservices:
      - Fundamentals: Microservices/Fundamentals.md
      - Communication: 03Microservice/01Communication.md
      - Data Management: Microservices/DataManagement.md
      - Resilience: Microservices/Resilience.md
      - Observability: Microservices/Observability.md

  - Spring Boot:
      - Fundamentals: SpringBoot/Fundamentals.md
      - Layered Architecture: SpringBoot/LayeredArchitecture.md
      - Building Microservices: SpringBoot/BuildingMicroservices.md
      - Security: SpringBoot/Security.md
      - Testing: SpringBoot/Testing.md

  - KafkaFundamentals:
      - ProducerConsumer: KafkaFundamentals/ProducerConsumer.md
  - Quiz: Quiz.md
markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.path
    - toc.follow
#    - toc.integrate
#    - header.autohide
extra_css:
  - css/custom.css